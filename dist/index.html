<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101725" />
    <meta
      name="description"
      content="Нить — короткие ежедневные тренировки связной и уверенной речи."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101725'/%3E%3Cpath d='M15 42c9-22 25-22 34 0M18 24c8 7 20 7 28 0' fill='none' stroke='%235de1c4' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Нить — тренажёр речи</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Нить — на главную">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>Нить</span>
        </a>
        <button class="icon-button" id="soundToggle" type="button" aria-label="Выключить звуки">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5Zm12.5.4a4 4 0 0 1 0 5.2M19.8 7a7 7 0 0 1 0 10" />
          </svg>
        </button>
      </header>

      <main id="app" tabindex="-1"></main>

      <footer class="privacy-note">
        <span aria-hidden="true">●</span>
        Записи хранятся только на этом устройстве
      </footer>
    </div>

    <template id="onboardingTemplate">
      <section class="onboarding-view" aria-labelledby="goalTitle">
        <div class="eyebrow">Настроим тренировку</div>
        <h1 id="goalTitle">Для чего тебе нужна уверенная речь?</h1>
        <p class="lead">Тексты для чтения будут общими, а задания для свободной речи — под твою цель.</p>

        <div class="goal-list" role="radiogroup" aria-label="Цель тренировки">
          <button class="goal-option" type="button" role="radio" aria-checked="false" data-goal="conversation">
            <strong>Свободно общаться</strong>
            <span>Поддерживать разговор и не терять мысль</span>
          </button>
          <button class="goal-option" type="button" role="radio" aria-checked="false" data-goal="words">
            <strong>Быстрее находить слова</strong>
            <span>Говорить точнее и реже зависать в поиске</span>
          </button>
          <button class="goal-option" type="button" role="radio" aria-checked="false" data-goal="speaker">
            <strong>Проводить лекции и занятия</strong>
            <span>Объяснять материал ясно и уверенно</span>
          </button>
          <button class="goal-option" type="button" role="radio" aria-checked="false" data-goal="work">
            <strong>Уверенно говорить на работе</strong>
            <span>Выступать на встречах и объяснять решения</span>
          </button>
          <button class="goal-option" type="button" role="radio" aria-checked="false" data-goal="creator">
            <strong>Записывать видео и вести блог</strong>
            <span>Говорить живо без заученного текста</span>
          </button>
        </div>

        <p class="change-warning" id="changeWarning" hidden>Смена цели начнёт текущую тренировку заново.</p>

        <button class="primary-button" id="saveGoal" type="button" disabled>
          <span>Продолжить</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>
    </template>

    <template id="weekTemplate">
      <section class="week-view" aria-labelledby="weekTitle">
        <div class="week-header">
          <div>
            <div class="eyebrow">Твоя программа</div>
            <h1 id="weekTitle">Неделя 1</h1>
            <p class="lead">Короткая тренировка каждый день: читаем вслух и сразу переносим навык в свободную речь.</p>
          </div>
          <div class="week-progress" aria-label="Прогресс недели">
            <strong id="weekProgressValue">0/7</strong>
            <span>дней готово</span>
          </div>
        </div>
        <button class="goal-chip" id="weekChangeGoal" type="button"></button>
        <div class="day-list" id="dayList"></div>
        <div class="reset-zone">
          <button class="text-button reset-trigger" id="resetProgress" type="button">Сбросить прогресс</button>
          <div class="reset-panel" id="resetPanel" hidden>
            <strong>Начать тестирование заново?</strong>
            <p>Будут удалены весь прогресс и голосовые записи из этого браузера. Сначала скачай нужные записи.</p>
            <div class="reset-actions">
              <button class="secondary-button" id="cancelReset" type="button">Отмена</button>
              <button class="danger-button" id="confirmReset" type="button">Удалить всё</button>
            </div>
            <p class="status-message" id="resetStatus" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </template>

    <template id="homeTemplate">
      <section class="home-view" aria-labelledby="homeTitle">
        <button class="week-back" id="backWeek" type="button">← Неделя 1</button>
        <div class="eyebrow" id="dayEyebrow">День 1 · Стартовая тренировка</div>
        <div class="thread-visual" aria-hidden="true">
          <span class="thread-dot"></span>
          <span class="thread-line"></span>
          <span class="thread-loop"></span>
        </div>
        <h1 id="homeTitle">Не потеряй мысль</h1>
        <p class="lead" id="dayLead">
          Научимся удерживать направление ответа, находить точные слова и уверенно завершать мысль.
        </p>
        <button class="goal-chip" id="changeGoal" type="button"></button>

        <div class="session-facts" aria-label="Параметры тренировки">
          <div><strong id="dayMinutes">8–12</strong><span>минут</span></div>
          <div><strong id="dayExerciseCount">5</strong><span>упражнений</span></div>
          <div><strong id="dayRecordingCount">4</strong><span>записи</span></div>
        </div>

        <button class="primary-button" id="startSession" type="button">
          <span>Начать тренировку</span>
          <span aria-hidden="true">→</span>
        </button>
        <p class="resume-note" id="resumeNote" hidden></p>

        <section class="saved-recordings" id="savedRecordings" aria-labelledby="savedRecordingsTitle" hidden>
          <h2 id="savedRecordingsTitle">Записи этого дня</h2>
          <p>Скачай нужные записи, чтобы они сохранились вне браузера.</p>
          <div class="recording-list" id="recordingList"></div>
          <p class="status-message" id="downloadStatus" aria-live="polite"></p>
        </section>
      </section>
    </template>

    <template id="sessionTemplate">
      <section class="session-view" aria-live="polite">
        <div class="session-head">
          <button class="back-button" id="backHome" type="button" aria-label="Вернуться на главную">←</button>
          <div class="progress-copy">
            <span id="stepLabel">Этап 1 из 6</span>
            <strong id="stepName">Контрольная запись</strong>
          </div>
          <button class="text-button" id="skipStep" type="button">Пропустить</button>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>

        <article class="exercise-card" id="exerciseCard"></article>
      </section>
    </template>

    <template id="ratingTemplate">
      <div class="rating-row" role="group">
        <button type="button" data-rating="1">1</button>
        <button type="button" data-rating="2">2</button>
        <button type="button" data-rating="3">3</button>
        <button type="button" data-rating="4">4</button>
        <button type="button" data-rating="5">5</button>
      </div>
    </template>

    <script src="./reading-variants.js" defer></script>
    <script src="./week-data.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
